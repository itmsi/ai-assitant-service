services:
  api:
    container_name: ai-api-service-test
    image: ai-api-service-test
    build:
      context: .
      dockerfile: Dockerfile-test
    # Load semua environment variables dari file .env
    # Semua config (database, redis, rabbitmq, dll) harus ada di file .env
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "9487:9487"
    volumes:
      - ./logs/test:/app/logs
      - ./public/test:/app/public
      - ./storages/test:/app/storages
    # Hanya override variables yang berbeda untuk Docker environment
    # Semua variables lain (DB_HOST_PROD, DB_USER_PROD, REDIS_HOST, dll) 
    # akan diambil dari file .env via env_file di atas
    environment:
      # Override untuk production server
      - NODE_ENV=development
      - APP_PORT=9487
      # RABBITMQ_URL akan diambil dari file .env via env_file
      # Override database host jika database di container/service lain (contoh)
      # - DB_HOST_PROD=postgres-service  # Uncomment jika DB di container lain
      # - POSTGRES_HOST=postgres-service  # Uncomment jika DB di container lain
      # Override Redis host jika Redis di container/service lain
      # Redis akan dikoneksikan ke network infra_net
      # - REDIS_HOST=redis-service  # Uncomment jika Redis di container lain
      # APM Configuration (disable untuk production jika tidak digunakan)
      - APM_SERVICE_URL=
      - APM_SERVICE_NAME=
      - APM_SERVICE_TOKEN=
      - ELASTIC_APM_SERVER_URL=
      - ELASTIC_APM_SECRET_TOKEN=
      - ELASTIC_APM_SERVICE_NAME=
      - ELASTIC_APM_ENVIRONMENT=production
      - ELASTIC_APM_ACTIVE=false
      - ELASTIC_APM_DISABLED=true
    networks:
      - infra_net
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9487/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  ai-assistant:
    container_name: ai-assistant-service-test
    image: ai-assistant-service-test
    build:
      context: .
      dockerfile: docker/Dockerfile.ai
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "9488:9488"
    environment:
      - NODE_ENV=production
      - AI_ASSISTANT_PORT=9488
      # Redis akan dikoneksikan ke network infra_net
      # - REDIS_HOST=redis-service  # Uncomment jika Redis di container lain
      # APM disable
      - ELASTIC_APM_ACTIVE=false
      - ELASTIC_APM_DISABLED=true
    networks:
      - infra_net
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9488/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

networks:
  infra_net:
    external: true  # PENTING! Gunakan network yang sudah ada
    name: infra_net  # Network untuk nginx dan cloudflare tunnel
