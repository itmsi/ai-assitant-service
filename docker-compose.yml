services:
  api:
    container_name: ai-api-service
    image: ai-api-service
    build:
      context: .
      dockerfile: Dockerfile
    # Load semua environment variables dari file .env
    # Semua config (database, redis, rabbitmq, dll) harus ada di file .env
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "9587:9587"
    volumes:
      - ./logs:/app/logs
      - ./public:/app/public
      - ./storages:/app/storages
    # Hanya override variables yang berbeda untuk Docker environment
    # Semua variables lain (DB_HOST_PROD, DB_USER_PROD, REDIS_HOST, dll) 
    # akan diambil dari file .env via env_file di atas
    environment:
      # Override untuk production server
      - NODE_ENV=development
      - APP_PORT=9587
      # RABBITMQ_URL akan diambil dari file .env via env_file
      # Override database host jika database di container/service lain (contoh)
      # - DB_HOST_PROD=postgres-service  # Uncomment jika DB di container lain
      # - POSTGRES_HOST=postgres-service  # Uncomment jika DB di container lain
      # Override Redis host jika Redis di container/service lain
      # Redis akan dikoneksikan ke network infra_net
      # - REDIS_HOST=redis-service  # Uncomment jika Redis di container lain
      # APM Configuration (disable untuk production jika tidak digunakan)
      - APM_SERVICE_URL=
      - APM_SERVICE_NAME=
      - APM_SERVICE_TOKEN=
      - ELASTIC_APM_SERVER_URL=
      - ELASTIC_APM_SECRET_TOKEN=
      - ELASTIC_APM_SERVICE_NAME=
      - ELASTIC_APM_ENVIRONMENT=production
      - ELASTIC_APM_ACTIVE=false
      - ELASTIC_APM_DISABLED=true
      # Mem0 memory server (internal network)
      - MEM0_BASE_URL=http://mem0:8000
      - MEM0_API_KEY=${MEM0_API_KEY}
    networks:
      - infra_net
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9587/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  ai-assistant:
    container_name: ai-assistant-service
    image: ai-assistant-service
    build:
      context: .
      dockerfile: docker/Dockerfile.ai
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "9588:9588"
    environment:
      - NODE_ENV=production
      - AI_ASSISTANT_PORT=9588
      # Redis akan dikoneksikan ke network infra_net
      # - REDIS_HOST=redis-service  # Uncomment jika Redis di container lain
      # APM disable
      - ELASTIC_APM_ACTIVE=false
      - ELASTIC_APM_DISABLED=true
      # Mem0 memory server (internal network)
      - MEM0_BASE_URL=http://mem0:8000
      - MEM0_API_KEY=${MEM0_API_KEY}
    networks:
      - infra_net
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9588/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # ============================================================
  # Mem0 — self-hosted memory server (menggantikan custom memory)
  # API internal: http://mem0:8000 | Host: http://localhost:9898
  # ============================================================
  mem0-db:
    container_name: mem0-pgvector
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: mem0
      POSTGRES_DB: mem0
    volumes:
      - mem0_db_data:/var/lib/postgresql/data
    networks:
      - infra_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mem0 -d mem0"]
      interval: 10s
      timeout: 5s
      retries: 5

  mem0:
    container_name: mem0-server
    # Image resmi mem0/mem0-api-server di Docker Hub sudah deprecated & hanya arm64.
    # Build dari source DIVENDOR (folder mem0-server/ di-commit ke repo, Dockerfile
    # sudah di-patch psycopg[binary]) — TANPA clone/sed manual.
    image: mem0/mem0-api-server:latest
    build:
      context: ./mem0-server/server
      dockerfile: Dockerfile
    restart: unless-stopped
    # Server mem0 v2 butuh migrasi metadata (tabel users/api_keys) sebelum start
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    depends_on:
      mem0-db:
        condition: service_healthy
    env_file:
      - .env
    # History SQLite server (default HISTORY_DB_PATH=/app/history/history.db)
    volumes:
      - mem0_history:/app/history
    environment:
      # LLM & embeddings — pakai Sumopod (OpenAI-compatible), bukan OpenAI
      # Server Mem0 membaca OPENAI_API_KEY + OPENAI_BASE_URL untuk provider 'openai'
      - OPENAI_API_KEY=${SUMOPOD_API_KEY}
      - OPENAI_BASE_URL=${SUMOPOD_BASE_URL}
      - MEM0_DEFAULT_LLM_MODEL=${SUMOPOD_MODEL:-gpt-5.4}
      # Vector store — Postgres + pgvector (service mem0-db)
      - POSTGRES_HOST=mem0-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=mem0
      - POSTGRES_PASSWORD=mem0
      - POSTGRES_DB=mem0
      # DB metadata auth (users/api_keys) — reuse DB mem0
      - APP_DB_NAME=mem0
      - MEM0_TELEMETRY=false
      # Auth — service-to-service pakai ADMIN_API_KEY (legacy X-API-Key)
      # JWT khusus Mem0, dipisah dari JWT_SECRET aplikasi utama
      - JWT_SECRET=${MEM0_JWT_SECRET:-mem0-default-jwt-secret-change-me}
      - ADMIN_API_KEY=${MEM0_API_KEY}
    ports:
      - "9898:8000"
    networks:
      - infra_net
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

volumes:
  mem0_db_data:
  # History SQLite server mem0 (jangan dihapus bersama down -v kalau data dibutuhkan)
  mem0_history:

networks:
  infra_net:
    external: true  # PENTING! Gunakan network yang sudah ada
    name: infra_net  # Network untuk nginx dan cloudflare tunnel
